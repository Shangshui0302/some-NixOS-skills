name: freshness report

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Resolve candidate nixpkgs lock
        run: >-
          nix flake update nixpkgs --flake .
          --reference-lock-file ./flake.lock
          --output-lock-file "$RUNNER_TEMP/flake.lock"

      - name: Report freshness status
        run: >-
          nix develop --command python3 scripts/check-freshness.py
          --candidate-lock "$RUNNER_TEMP/flake.lock"
          --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Check candidate flake
        run: nix flake check . --reference-lock-file "$RUNNER_TEMP/flake.lock" --no-write-lock-file --show-trace

      - name: Build candidate skill outputs
        run: nix build --reference-lock-file "$RUNNER_TEMP/flake.lock" --no-write-lock-file .#nix-packaging .#nixos-ecosystem .#all-skills --no-link

      - name: Require review when freshness needs attention
        run: >-
          nix develop --command python3 scripts/check-freshness.py
          --candidate-lock "$RUNNER_TEMP/flake.lock"
          --fail-on-attention
