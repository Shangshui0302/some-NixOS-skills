name: skill checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Validate skill structure
        run: |
          nix develop --command python3 skills/nix-packaging/scripts/validate-skill.py skills/nix-packaging
          nix develop --command python3 skills/nix-packaging/scripts/validate-skill.py skills/nixos-ecosystem

      - name: Check freshness manifest
        run: nix develop --command python3 scripts/check-freshness.py --format json

      - name: Check flake
        run: nix flake check --show-trace

      - name: Build skill outputs
        run: nix build .#nix-packaging .#nixos-ecosystem .#all-skills --no-link
